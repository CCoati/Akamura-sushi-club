    <!-- Netlify Badge & Feedback Blocker -->
    <script>
      (function() {
        try {
          localStorage.setItem('netlify-badge-hidden', 'true');
          localStorage.setItem('netlify-feedback-hidden', 'true');
          sessionStorage.setItem('netlify-badge-hidden', 'true');
        } catch(e) {}

        function killNetlifyBadge() {
          try {
            document.querySelectorAll('*').forEach(function(el) {
              var tag = el.tagName ? el.tagName.toLowerCase() : '';
              var id = el.id ? el.id.toLowerCase() : '';
              var cls = (typeof el.className === 'string') ? el.className.toLowerCase() : '';
              if (
                tag.indexOf('netlify') !== -1 ||
                id.indexOf('netlify') !== -1 ||
                cls.indexOf('netlify') !== -1 ||
                el.hasAttribute('data-netlify-badge') ||
                el.hasAttribute('data-netlify-deploy-id')
              ) {
                el.style.setProperty('display', 'none', 'important');
                el.style.setProperty('opacity', '0', 'important');
                el.style.setProperty('visibility', 'hidden', 'important');
                el.style.setProperty('pointer-events', 'none', 'important');
                el.style.setProperty('position', 'absolute', 'important');
                el.style.setProperty('left', '-9999px', 'important');
                if (el.parentNode) el.parentNode.removeChild(el);
              }
              if (el.shadowRoot) {
                var sRootContent = el.shadowRoot.innerHTML || '';
                if (sRootContent.toLowerCase().indexOf('netlify') !== -1) {
                  el.style.setProperty('display', 'none', 'important');
                  if (el.parentNode) el.parentNode.removeChild(el);
                }
              }
            });
          } catch(err) {}
        }

        killNetlifyBadge();
        var obs = new MutationObserver(killNetlifyBadge);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', killNetlifyBadge);
        window.addEventListener('load', killNetlifyBadge);
      })();
    </script>
